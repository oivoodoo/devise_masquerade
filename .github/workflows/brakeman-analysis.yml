# This workflow integrates Brakeman with GitHub's Code Scanning feature
# Brakeman is a static analysis security vulnerability scanner for Ruby on Rails applications

name: Brakeman Scan

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  brakeman-scan:
    name: Brakeman Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Setup Brakeman
      run: gem install brakeman

    # Scan the dummy Rails app. The gem root is not a Rails application, so
    # `brakeman .` exits before writing SARIF. --no-exit-on-warn/error keeps
    # findings in the report instead of failing the job.
    - name: Scan
      run: |
        brakeman --path spec/dummy \
          -f sarif \
          -o output.sarif.json \
          --no-exit-on-warn \
          --no-exit-on-error

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: output.sarif.json
        category: brakeman
