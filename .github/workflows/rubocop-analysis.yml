name: "Rubocop"

on: push

permissions:
  contents: read

jobs:
  rubocop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2

    # 0.6.1 maps last_column 0 to real_column; 0.3.0 emitted endColumn 0
    # which github/codeql-action/upload-sarif@v4 rejects (must be >= 1).
    - name: Install Code Scanning integration
      run: bundle add code-scanning-rubocop --version 0.6.1 --skip-install

    - name: Install dependencies
      run: bundle install

    - name: Rubocop run
      run: |
        bash -c "
          bundle exec rubocop --require code_scanning --format CodeScanning::SarifFormatter -o rubocop.sarif
          [[ $? -ne 2 ]]
        "

    - name: Normalize SARIF columns
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        path = Path("rubocop.sarif")
        data = json.loads(path.read_text())

        def fix(node):
            if isinstance(node, dict):
                for key in ("startColumn", "endColumn"):
                    value = node.get(key)
                    if isinstance(value, int) and value < 1:
                        node[key] = 1
                for value in node.values():
                    fix(value)
            elif isinstance(node, list):
                for item in node:
                    fix(item)

        fix(data)
        path.write_text(json.dumps(data))
        PY

    - name: Upload Sarif output
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: rubocop.sarif
        category: rubocop
